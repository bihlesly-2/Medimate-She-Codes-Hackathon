<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MEDIMATE: Track • Remind • Live Healthier</title>
    <meta name="description" content="Find verified pharmacies, compare reported medicine prices, get reminders for your own prescription and keep a simple health log on the web, by SMS or by USSD." />
    <meta name="theme-color" content="#0B6FD0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MEDIMATE" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Splash shown until the app script takes over #root (no JavaScript needed, so it shows instantly). */
      .mm-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f7fafc; font-family: system-ui, sans-serif; }
      .mm-splash-mark { position: relative; width: 96px; height: 96px; border-radius: 28px; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 0 #d9dee5; }
      .mm-splash-mark img { width: 72px; height: 72px; animation: mm-splash-bob 1.4s ease-in-out infinite; }
      .mm-splash-word { font-weight: 900; letter-spacing: 0.06em; font-size: 28px; }
      .mm-splash-word b { color: #1a7f37; } .mm-splash-word i { color: #0b6fd0; font-style: normal; }
      .mm-splash-bar { width: 140px; height: 8px; border-radius: 99px; background: #e8f3fd; overflow: hidden; }
      .mm-splash-bar span { display: block; width: 40%; height: 100%; border-radius: 99px; background: #2fae4a; animation: mm-splash-load 1.1s ease-in-out infinite; }
      @keyframes mm-splash-bob { 50% { transform: translateY(-6px); } }
      @keyframes mm-splash-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .mm-splash-mark img, .mm-splash-bar span { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>MEDIMATE needs JavaScript in the browser. On a basic phone, use SMS or USSD instead.</noscript>
    <div id="root">
      <div class="mm-splash" role="status" aria-label="Loading MEDIMATE">
        <div class="mm-splash-mark"><img src="/brand/medimate-mark.png" alt="" /></div>
        <div class="mm-splash-word"><b>MEDI</b><i>MATE</i></div>
        <div class="mm-splash-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
