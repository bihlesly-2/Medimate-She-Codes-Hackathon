# Runs the MEDIMATE reminder engine every 5 minutes (Vercel Hobby cron runs only once a day).
# Needs repository secret CRON_SECRET (same value as on Vercel) and variable or default APP_URL.
# GitHub may delay scheduled runs by a few minutes at busy times.
name: Reminder engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run one tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://medimate-she-codes.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in the repository secrets; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/tick"
          echo
